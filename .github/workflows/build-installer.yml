# ===========================================================================
#  Compila o instalador do PySusNoCode e publica a Release automaticamente
#  a cada tag de versao (vX.Y.Z).
#
#  Como lancar uma versao:
#    1. Atualize __version__ em pysusnocode/__init__.py (ex.: "1.2.0")
#       e o padrao em installer/PySusNoCode.iss
#    2. git commit + git push
#    3. git tag v1.2.0 && git push origin v1.2.0
#  O resto e automatico: o instalador compilado entra na Release com o nome
#  versionado e com a copia de nome fixo PySusNoCode-Setup.exe (que mantem o
#  link permanente releases/latest/download/PySusNoCode-Setup.exe).
# ===========================================================================
name: Compilar instalador

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

# O contexto `secrets` nao pode ser usado em `if:` de passos; o teste de
# "assinatura configurada" e feito por esta variavel de ambiente.
env:
  SIGNPATH_CONFIGURADO: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Determinar a versao a partir da tag
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versao: $version"

      - name: Conferir se a versao do aplicativo bate com a tag
        shell: pwsh
        run: |
          $m = Select-String -Path "pysusnocode/__init__.py" -Pattern '__version__ = "(.+)"'
          $appVer = $m.Matches.Groups[1].Value
          if ($appVer -ne "${{ steps.ver.outputs.version }}") {
            Write-Error ("A tag v${{ steps.ver.outputs.version }} nao bate com " +
              "pysusnocode/__init__.py (__version__ = `"$appVer`"). " +
              "Atualize __version__, faca commit e recrie a tag.")
          }

      - name: Garantir o Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # Os exemplos vao dentro das duas versoes: a lista precisa abrir mesmo
      # onde a rede e bloqueada.
      - name: Trazer os notebooks de exemplo
        shell: pwsh
        run: pwsh -File "installer\copiar_exemplos.ps1"

      - name: Compilar o instalador enxuto
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            "installer\PySusNoCode.iss"

      # ---- Versao completa, para redes que bloqueiam o pypi.org ----
      # Prefeituras, hospitais e unidades de saude costumam barrar o acesso ao
      # repositorio de pacotes do Python. Esta versao leva tudo dentro.
      - name: Baixar as bibliotecas para a versao completa
        shell: pwsh
        run: pwsh -File "installer\baixar_wheels.ps1"

      - name: Compilar o instalador completo
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} /DOFFLINE=1 `
            "installer\PySusNoCode.iss"

      # ---- Assinatura digital via SignPath (dormente ate os secrets existirem) ----
      # Ativa sozinha quando os 4 secrets estiverem configurados no repositorio:
      # SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_SIGNING_POLICY_SLUG. Veja installer/ASSINATURA-DIGITAL.md.
      - name: Enviar artefato para assinatura (SignPath)
        id: upload-unsigned
        if: ${{ env.SIGNPATH_CONFIGURADO == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: instalador-nao-assinado
          path: installer/Output/PySusNoCode-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Assinar o instalador (SignPath)
        if: ${{ env.SIGNPATH_CONFIGURADO == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/Output/assinado

      - name: Substituir pelo instalador assinado (SignPath)
        if: ${{ env.SIGNPATH_CONFIGURADO == 'true' }}
        shell: pwsh
        run: |
          Copy-Item "installer/Output/assinado/PySusNoCode-Setup-${{ steps.ver.outputs.version }}.exe" `
            "installer/Output/PySusNoCode-Setup-${{ steps.ver.outputs.version }}.exe" -Force
          Write-Host "Instalador substituido pela versao assinada."

      - name: Criar as copias de nome fixo (links permanentes)
        shell: pwsh
        run: |
          Copy-Item "installer/Output/PySusNoCode-Setup-${{ steps.ver.outputs.version }}.exe" `
            "installer/Output/PySusNoCode-Setup.exe"
          Copy-Item "installer/Output/PySusNoCode-Setup-Completo-${{ steps.ver.outputs.version }}.exe" `
            "installer/Output/PySusNoCode-Setup-Completo.exe"
          Get-ChildItem "installer/Output" |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # A release e criada VAZIA e cada arquivo sobe em seguida, um a um.
      #
      # Antes tudo ia numa chamada so, e quando um envio falhava o `gh` levava
      # a release junto: sobrava uma compilacao inteira perdida e um "exit code
      # 1" sem dizer qual arquivo tinha falhado. Foi o que aconteceu duas vezes
      # na v1.8.10 (o passo levava 30s nas versoes anteriores e passou a gastar
      # 5 minutos antes de desistir). Separado assim, a release sobrevive, o
      # log diz o nome e o tamanho do arquivo que nao subiu, e da para repetir
      # so o envio que falhou.
      - name: Publicar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se a release ja existir (tentativa anterior que subiu parte dos
          # arquivos), seguimos direto para os envios em vez de quebrar aqui.
          gh release view "${{ github.ref_name }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} ja existe; vou apenas enviar os arquivos."
          } else {
          gh release create "${{ github.ref_name }}" `
            --title "PySusNoCode ${{ steps.ver.outputs.version }}" `
            --generate-notes `
            --notes "Instalador para Windows 10/11 (64 bits), por usuario e sem administrador.

          **Qual baixar:**

          - **PySusNoCode-Setup.exe** (cerca de 14 MB) - baixa as bibliotecas durante a instalacao. Serve para a maioria dos computadores.
          - **PySusNoCode-Setup-Completo.exe** (cerca de 350 MB) - traz todas as bibliotecas dentro e nao acessa a internet para instalar. Use esta em prefeituras, hospitais e unidades de saude, onde a rede costuma bloquear o pypi.org.

          Os arquivos sem numero de versao no nome sao copias identicas, usadas pelos links permanentes de download."
            if ($LASTEXITCODE -ne 0) { throw "gh release create falhou" }
          }

          $arquivos = @(
            "PySusNoCode-Setup-${{ steps.ver.outputs.version }}.exe",
            "PySusNoCode-Setup.exe",
            "PySusNoCode-Setup-Completo-${{ steps.ver.outputs.version }}.exe",
            "PySusNoCode-Setup-Completo.exe"
          )

          $falhas = @()
          foreach ($nome in $arquivos) {
            $caminho = "installer/Output/$nome"
            $mb = [math]::Round((Get-Item $caminho).Length / 1MB, 1)
            Write-Host "Enviando $nome ($mb MB)..."
            $inicio = Get-Date
            gh release upload "${{ github.ref_name }}" $caminho --clobber
            $segundos = [math]::Round(((Get-Date) - $inicio).TotalSeconds)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::FALHOU o envio de $nome ($mb MB) depois de ${segundos}s"
              $falhas += $nome
            } else {
              Write-Host "  ok em ${segundos}s"
            }
          }

          if ($falhas.Count -gt 0) {
            Write-Host "::error::Nao subiram: $($falhas -join ', '). A release foi criada e os demais arquivos estao la; repita o envio dos que faltam."
            exit 1
          }
          Write-Host "Release publicada com os $($arquivos.Count) arquivos."
